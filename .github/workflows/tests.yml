name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Compile with all lint warnings
        working-directory: HospitalTriage
        run: |
          mkdir -p out
          find src -name '*.java' > out/sources.txt
          javac -encoding UTF-8 --release 17 -Xlint:all -d out @out/sources.txt
      - name: Run test suite
        working-directory: HospitalTriage
        run: java -Djava.awt.headless=true -Dfile.encoding=UTF-8 -cp out hospital.Main --test
